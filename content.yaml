                coauthors: "Steven Verheyen"
                url: "https://econtent.hogrefe.com/doi/10.1027/1618-3169/a000558"

          - id: phil-science
            title: Philosophy of Science
            intro: |
              My philosophy of science research examines research methodology and science communication practices.
            publications:
