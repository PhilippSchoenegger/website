  - id: positions
    title: Previous Positions
    intro: |
      My career spans both academic and non-academic roles, moving from Austria to St Andrews for my PhD, then to the Forecasting Research Institute and LSE, and now to Microsoft AI.
    children:
      # Academic Positions
      - id: academic
        title: Academic
        children:
          - id: lse
            title: London School of Economics
            period: "2023-2025"
            intro: |
              From 2023-2025, I was a post-doctoral researcher at the [London School of Economics](https://www.lse.ac.uk/), working at the [Behavioural Lab](https://www.lse.ac.uk/behavioural-lab/?entryId=2319c173-7bdc-45d3-9a69-d12fd54340d7&nodeId=e2e64854-5d30-44fa-a289-a5ef76104f3e) with Barbara Fasolo and Matteo Galizzi. I worked at the intersection of applied AI and behavioural science. My position was funded by [Longview Philanthropy](https://www.longview.org/) for AI forecasting research, with additional support from the [LSE Department of Management](https://www.lse.ac.uk/management) for behavioural science work, the [Wharton-INSEAD Alliance](https://insead.wharton.upenn.edu/) for teaching and research collaboration, and the [Wharton AI & Analytics Initiative](https://ai-analytics.wharton.upenn.edu/) for AI-focused research. I taught at [LSE](https://www.lse.ac.uk/) and [INSEAD](https://www.insead.edu/), and presented at the [UK Ministry of Defence](https://www.gov.uk/government/organisations/ministry-of-defence), [King's College London](https://www.kcl.ac.uk/), and the [TBD Conference](https://www.thetbdconference.com/).
            selected_media_coverage:
              - text: "Forbes"
                url: "https://www.forbes.com/sites/tomasgorny/2024/12/02/should-businesses-trust-ai-to-predict-customer-behaviors/"
              - text: "BigThink"
                url: "https://bigthink.com/thinking/anti-natalism-psychopaths-having-children-immoral/"
              - text: "Astral Codex Ten"
                url: "https://www.astralcodexten.com/p/mantic-monday-31124"
              - text: "Marginal Revolution"
                url: "https://marginalrevolution.com/marginalrevolution/2023/09/do-llms-diminish-diversity-of-thought.html"
            selected_reviewing:
              - "Decision"
              - "Cognition"
              - "Personality and Individual Differences"
              - "Royal Society Open"
              - "PCI RR"

          - id: fri
            title: Forecasting Research Institute
            period: "2023"
            intro: |
              In 2023, I worked with Philip Tetlock at the [Forecasting Research Institute](https://forecastingresearch.org/) on AI forecasting, low-probability event elicitation, and prediction methodology.

          - id: standrews
            title: University of St Andrews
            period: "2018-2022"
            intro: |
              From 2018-2022, I completed a Master's and a PhD at St Andrews, where my research moved from philosophy to more heavily into economics and experimental philosophy/psychology as my methods became more quantitatively focused.
            children:
              - id: standrews-phd
                title: PhD
                period: "Completed 2022"
                intro: |
                  In 2022, I completed a PhD in Philosophy and Economics with the title 'Moral Decision-Making: Essays from Philosophy and Economics' under the supervision of Theron Pummer and Miguel Costa-Gomes at [St Andrews](https://www.st-andrews.ac.uk/). The dissertation comprises three philosophy papers and three economics papers, reflecting my interdisciplinary training. My research was funded by the Forethought Foundation, the [Centre for Effective Altruism](https://www.centreforeffectivealtruism.org/), [Giving What We Can](https://www.givingwhatwecan.org/), and the [Long-Term Future Fund](https://funds.effectivealtruism.org/funds/far-future). I presented at the [Scottish Economic Society Annual Conference](https://scotecon.org/), the [UK Experimental Philosophy Workshop](https://x-phi.uea.ac.uk/online-workshop/), the [Behavioural Economics, Society, and Technology Conference](https://research.qut.edu.au/best/), and the [London Graduate Conference in History of Political Thought](https://projects.history.qmul.ac.uk/hpt/category/london-graduate-conference-in-history-of-political-thought/), among others. My work received coverage in [Süddeutsche Zeitung](https://www.sueddeutsche.de/politik/ethik-einsicht-und-konsequenz-1.4378347), [The Times](https://www.thetimes.co.uk/article/ethics-professors-don-t-walk-the-walk-d7n6097m8), [Psychology Today](https://www.psychologytoday.com/us/blog/unique-everybody-else/202109/are-dark-triad-traits-adaptive), [Die Zeit](https://www.zeit.de/2021/49/liberalismus-corona-klima-fdp-friedrich-august-von-hayek/komplettansicht), and [PsyPost](https://www.psypost.org/2022/03/dark-triad-personality-traits-are-more-common-among-those-who-believe-procreation-is-morally-wrong-62746), and is cited on [Wikipedia](https://es.wikipedia.org/?curid=1309987).
                children:
                  - id: standrews-mlitt
                    title: MLitt
                    period: "Completed 2018"
                    intro: |
                      In 2018, I completed the MLitt in Moral, Political, and Legal Philosophy at [St Andrews](https://www.st-andrews.ac.uk/), where I was on the 2018-2019 Dean's List.

              - id: standrews-fellowships
                title: Fellowships
                intro: |
                  During my time at St Andrews, I held several fellowships: I was an Associate Fellow at [AdvanceHE](https://www.advance-he.ac.uk/fellowship/associate-fellowship) for continued education in teaching, a Bernard Marcus Fellow at the [Institute for Human Studies](https://www.theihs.org/) focusing on Locke and liberalism, a visitor and Global Priorities Fellow at the [Global Priorities Institute](https://www.globalprioritiesinstitute.org/) at the University of Oxford working on effective charitable giving, and an Oscar Morgenstern Fellow at the [Mercatus Center](https://www.mercatus.org/) at George Mason University working on mainline economics.

      # Forecasting Positions
      - id: forecasting
        title: Forecasting
        intro: |
          I qualified as a Pro Forecaster in 2022, and have since worked on forecasting projects spanning AI capabilities, geopolitical conflicts, and economic trends.
        children:
          - id: seldon
            title: Seldon Capital
            period: "2024-2025"
            intro: |
              Between 2024 and 2025, I led the forecasting team at [Seldon Capital](https://www.seldon.capital/) for a year, working on macroeconomic and technology factors including coal markets, drug overdose trends, geopolitical developments, and AI progress.

          - id: swift
            title: Swift Centre
            period: "2023-2025"
            intro: |
              Between 2023 and 2025, I was a forecaster for the [Swift Centre](https://www.swiftcentre.org/), working on questions including coal markets, drug overdose trends, geopolitical developments, and AI progress. This included forecasting for the future capabilities of frontier AI models for Google DeepMind (see our [forecasting paper](https://arxiv.org/pdf/2403.13793)).

          - id: metaculus
            title: Metaculus
            period: "2022-2025"
            intro: |
              Between 2022 and 2025, I was a [Pro Forecaster](https://www.metaculus.com/pro-forecasters/) at [Metaculus](https://www.metaculus.com/), qualifying based on my track record, calibration, and quality of written rationales. I worked on projects with the [Federation of American Scientists](https://fas.org/publication/mathematically-predicting-the-future-with-professional-forecaster-philip-schoenegger/) and the [Carnegie Endowment for International Peace](https://carnegieendowment.org/research/2025/04/forecasting-nuclear-escalation-risks-cloudy-with-a-chance-of-fallout?lang=en).

      # Undergraduate
      - id: undergraduate
        title: Undergraduate
        children:
          - id: graz
            title: University of Graz
            period: "2014-2018"
            intro: |
              From 2014-2018, I was an undergraduate student at the University of Graz, completing three concurrent degrees: a Mag.phil. teaching degree in Psychology, Philosophy and German, a BA in Philosophy, and a BA in German Philology. I earned two academic performance scholarships. During this time, I was an unofficial visiting student at the [University Center for Human Values](https://uchv.princeton.edu/) at [Princeton University](https://www.princeton.edu/), where I wrote my thesis under the supervision of Peter Singer.
            children:
              - id: mtg
                title: "Magic: The Gathering"
                period: "2012-2015"
                intro: |
                  Before and during my undergraduate studies (2012-2015), I was a semi-professional Magic: The Gathering player in the Legacy format, achieving a 74.6% win-rate in Grand Prix-level tournaments, the fifth highest in the world at the time. I placed 4th at GP Paris (1,587 players) and 4th at GP New Jersey (4,003 players), and was sponsored by [Team MTG Mint Card](https://www.mtgmintcard.com/team-mtgmintcard) and [MTG Madness](https://web.archive.org/web/20140208062415/https://www.mtgmadness.com/). Tournament reports: [GP Paris Top 4](https://www.eternalcentral.com/there-and-back-again-grand-prix-paris-top-4-report-with-miracles/), [GP New Jersey Story](https://articles.starcitygames.com/articles/one-journey-one-miracle-a-grand-prix-new-jersey-story/).
