  # RESEARCH
  # --------------------------------------------------------------------------
  - id: research
    title: Research
    intro: |
      My research is inter- and multi-disciplinary, primarily at the intersection of AI, economics, philosophy, and psychology. I have studied AI evaluations, forecasting, charitable giving, experimental philosophy, and more. My work has been cited >1,500 times with an h-index of 15. See my [Google Scholar](https://scholar.google.com/citations?hl=en&user=kDAq8DcAAAAJ&view_op=list_works&sortby=pubdate) for a full list of publications.
    children:
      # AI Research
      - id: ai
        title: Artificial Intelligence
        intro: |
          My main research focus is at the intersection of AI and social science, examining forecasting capabilities (geopolitics, economics, and more) as well as persuasion capabilities.
        children:
          - id: ai-evaluations
            title: Evaluations
            intro: |
              I study AI capabilities in forecasting and persuasion. Forecasting serves as an excellent evaluation metric because predictions are by definition out of the training distribution and ground truth cannot be revealed at test time. Persuasion capabilities matter equally as they represent a central pathway through which AI systems influence human decision-making. My research shows that models are at best indistinguishable from human crowds for forecasting, but likely still below, while persuasion and personality prediction capabilities are definitively at human and even expert level.
            publications:
              - year: 2024
                title: "Diminished Diversity-of-Thought in a Standard Large Language Model"
                journal: "Behavior Research Methods"
                coauthors: "Peter S. Park, Chongyang Zhu"
                url: "https://link.springer.com/article/10.3758/s13428-023-02307-x"
              - year: 2024
                title: "Wisdom of the Silicon Crowd: LLM Ensemble Prediction Capabilities Rival Human Crowd Accuracy"
                journal: "Science Advances"
                coauthors: "Indre Tuminauskaite, Peter S. Park, Rafael V.S. Bastos, Philip E. Tetlock"
                url: "https://doi.org/10.1126/sciadv.adp1528"
              - year: 2025
                title: "AI-Augmented Predictions: LLM Assistants Improve Human Forecasting Accuracy"
                journal: "ACM Transactions on Interactive Intelligent Systems"
                coauthors: "Peter S. Park, Ezra Karger, Sean Trott, Philip E. Tetlock"
                url: "https://doi.org/10.1145/3707649"
              - year: 2023
                title: "Large Language Model Prediction Capabilities: Evidence From a Real-World Forecasting Tournament"
                journal: "arXiv Preprint arXiv:2310.13014"
                coauthors: "Peter S. Park"
                url: "https://arxiv.org/abs/2310.13014"
              - year: 2025
                title: "Large Language Models Are More Persuasive Than Incentivized Human Persuaders"
                journal: "arXiv Preprint arXiv:2505.09662"
                coauthors: "Francesco Salvi, Jiacheng Liu, Xiaoli Nan, Ramit Debnath, Barbara Fasolo, Evelina Leivada, Gabriel Recchia, Fritz Günther, Ali Zarifhonarvar, Joe Kwon, Zahoor Ul Islam, Marco Dehnert, Daryl Y. H. Lee, Madeline G. Reinecke, David G. Kamper, Mert Kobaş, Adam Sandford, Jonas Kgomo, Luke Hewitt, Shreya Kapoor, Kerem Oktar, Eyup Engin Kucuk, Bo Feng, Cameron R. Jones, Izzy Gainsburg, Sebastian Olschewski, Nora Heinzelmann, Francisco Cruz, Ben M. Tappin, Tao Ma, Peter S. Park, Rayan Onyonka, Arthur Hjorth, Peter Slattery, Qingcheng Zeng, Lennart Finke, Igor Grossmann, Alessandro Salatiello, Ezra Karger"
                url: "https://arxiv.org/abs/2505.09662"
              - year: 2025
                title: "AI Can Outperform Humans in Predicting Correlations Between Personality Items"
                journal: "Communications Psychology"
                coauthors: "Spencer Greenberg, Alexander Grishin, Lucius Caviola"
                url: "https://doi.org/10.1038/s44271-025-00205-w"

          - id: ai-posttraining
            title: Posttraining & Prompt Engineering
            intro: |
              My posttraining work with [Lightning Rod Labs](https://www.lightningrod.ai/) uses reinforcement learning from verifiable rewards (RLVR), specifically GRPO, to improve forecasting capabilities of small models. While prompt engineering promises to be effective given its low cost, we do not find strong effects in our research.
            publications:
              - year: 2025
                title: "LLMs Can Teach Themselves to Better Predict the Future"
                journal: "arXiv Preprint arXiv:2502.05253"
                coauthors: "Benjamin Turtel, Danny Franklin"
                url: "https://arxiv.org/abs/2502.05253"
              - year: 2025
                title: "Outcome-Based Reinforcement Learning to Predict the Future"
                journal: "Transactions on Machine Learning Research"
                coauthors: "Benjamin Turtel, Danny Franklin, Kris Skotheim, Luke Hewitt"
                url: "https://openreview.net/pdf?id=bbhdeL8EUX"
              - year: 2025
                title: "Prompt Engineering Large Language Models' Forecasting Capabilities"
                journal: "arXiv Preprint arXiv:2506.01578"
                coauthors: "Caleb R. Jones, Philip E. Tetlock, Barbara Mellers"
                url: "https://arxiv.org/abs/2506.01578"

          - id: ai-other
            title: Other
            intro: |
              We conducted a descriptive analysis of Copilot usage patterns throughout 2025, examining temporal and modal dynamics of how users interact with AI assistants.
            publications:
              - year: 2025
                title: "It's About Time: The Temporal and Modal Dynamics of Copilot Usage"
                journal: "arXiv Preprint arXiv:2512.11879"
                coauthors: "Beatriz Costa-Gomes, Sophia Chen, Connie Hsueh, Deborah Morgan, Yash Shah, Sam Way, Yuki Zhu, Timothé Adeline, Michael Bhaskar, Mustafa Suleyman, Seth Spielman"
                url: "https://arxiv.org/abs/2512.11879"

      # Economics Research
      - id: economics
        title: Economics
        intro: |
          I trained as a behavioural economist, focusing on charitable giving and forecasting causal effects.
        children:
          - id: econ-behavioural
            title: Behavioural Economics
            intro: |
              My behavioural economics research focuses on charitable giving and moral decision-making. Key findings include that moral arguments can boost charitable giving, even when they increase the perceived demandingness of donations.
            publications:
              - year: 2022
                title: "Sure-Thing vs. Probabilistic Charitable Giving: Experimental Evidence on the Role of Individual Differences in Risky and Ambiguous Charitable Decision-Making"
                journal: "PLOS ONE"
                coauthors: "Miguel Costa-Gomes"
                url: "https://doi.org/10.1371/journal.pone.0273971"
              - year: 2023
                title: "Demanding the Morally Demanding: Experimental Evidence on the Effects of Moral Arguments and Moral Demandingness on Charitable Giving"
                journal: "Journal of Behavioral and Experimental Economics"
                coauthors: "Ben Grodeck"
                url: "https://www.sciencedirect.com/science/article/abs/pii/S2214804323000149"
              - year: 2022
                title: "Charitable Giving Under Normative Uncertainty: Experimental Evidence on the Behavioral Impact of Normative Expert Advice"
                journal: "Available at SSRN"
                coauthors: "Miguel Costa-Gomes"
                url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4389737"

          - id: econ-decision
            title: Decision Science
            intro: |
              My decision science research examines forecasting of long-run causal effects and methods for improving low-probability judgements, connecting economic methodology with prediction science.
            publications:
              - year: 2024
                title: "Forecasting Long-Run Causal Effects"
                journal: "SSRN"
                coauthors: "David R. Bernard"
                url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4702393"
