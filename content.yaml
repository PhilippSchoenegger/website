site:
  title: "Philipp Schoenegger"
  tagline: "I work on Microsoft AI's Futures team in the Office of the CEO."
  intro: |
    My current research focuses on the economic impacts of advanced artificial intelligence, AI consciousness and its societal impacts, and forecasting AI progress among other related topics. Connect on [Twitter](https://x.com/SchoeneggerPhil), [LinkedIn](https://www.linkedin.com/in/philipp-schoenegger-755117211/), or reach out via [email](mailto:contact.schoenegger@gmail.com).

