          - id: phil-political
            title: Political Theory
            intro: |
              My political theory research focuses on liberalism, particularly the work of John Locke. I examine Locke's theory of prerogative, its relationship to natural law and democratic theory, and the epistemological foundations of liberal thought.
            publications:
