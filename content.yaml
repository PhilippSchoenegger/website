            title: Experimental Philosophy
            intro: |
              My experimental philosophy research spans methods (Bayesian Truth Serum) and empirical experiments in population ethics and moral psychology. I develop applications of BTS for incentive-compatible elicitation in philosophical surveys and test its practical implementation.
